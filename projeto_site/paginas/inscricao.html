<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../estilo.css">
</head>
<body>
    <h2>Matrícula na Academia</h2>
    <form>
        <table border="0" cellpadding="8" class="tabela-form">
            <tr class="form-header">
                <td colspan="3">Ficha de Inscrição</td>
            </tr>
            <tr>
                <td>Nome Completo:</td>
                <td><input type="text" name="nome" size="25"></td>
                <td class="dica">Obrigatório</td>
            </tr>
            <tr>
                <td>Data de Nascimento:</td>
                <td><input type="text" name="nascimento" size="25"></td>
                <td class="dica">Formato DD/MM/AAAA</td>
            </tr>
            <tr>
                <td>Telefone de Contato:</td>
                <td><input type="text" name="telefone" size="25"></td>
                <td class="dica">Apenas números</td>
            </tr>
            <tr>
                <td>Plano Desejado:</td>
                <td>
                    <select name="plano">
                        <option>Plano Mensal (Básico)</option>
                        <option>Plano Semestral</option>
                        <option>Plano Anual (VIP)</option>
                    </select>
                </td>
                <td class="dica">Selecione uma opção</td>
            </tr>
            <tr>
                <td colspan="3" align="center">
                    <input type="submit" value="Finalizar Matrícula">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
