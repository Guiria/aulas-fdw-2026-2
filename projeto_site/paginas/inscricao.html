<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../estilo.css">
</head>
<body>
    <h2>Inscrição para o Campeonato</h2>
    <form>
        <table border="0" cellpadding="8" class="tabela-form">
            <tr class="form-header">
                <td colspan="3">Preencha seus dados</td>
            </tr>
            <tr>
                <td>Nome Completo:</td>
                <td><input type="text" name="nome" size="25"></td>
                <td class="dica">Seu nome real e completo</td>
            </tr>
            <tr>
                <td>Nickname no Jogo:</td>
                <td><input type="text" name="nick" size="25"></td>
                <td class="dica">Nome de usuário (obrigatório)</td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="text" name="email" size="25"></td>
                <td class="dica">Para enviarmos a confirmação</td>
            </tr>
            <tr>
                <td>Classe/Personagem:</td>
                <td>
                    <select name="classe">
                        <option>Guerreiro</option>
                        <option>Mago</option>
                        <option>Hacker</option>
                    </select>
                </td>
                <td class="dica">Sua classe principal no jogo</td>
            </tr>
            <tr>
                <td colspan="3" align="center">
                    <input type="submit" value="Enviar Inscrição">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
