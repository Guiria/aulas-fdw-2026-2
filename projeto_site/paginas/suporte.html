<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../estilo.css">
</head>
<body>
    <h2>Central de Suporte</h2>
    <p>Precisa de ajuda? Abra um chamado preenchendo o formulário abaixo:</p>
    <form>
        <table border="0" cellpadding="8" class="tabela-form">
            <tr class="form-header">
                <td colspan="2">Abertura de Chamado</td>
            </tr>
            <tr>
                <td>Motivo do Contato:</td>
                <td>
                    <select name="motivo">
                        <option>Dúvida sobre o Treino</option>
                        <option>Problema Financeiro/Pagamento</option>
                        <option>Dúvida sobre Planos</option>
                        <option>Outros</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Sua Mensagem:</td>
                <td>
                    <textarea name="mensagem" rows="5" cols="40"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="button" value="Enviar Chamado">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
