<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Cadastro de Funcionários</h2>
    <form>
        <table border="0" cellpadding="5">
            <tr>
                <td>Nome:</td>
                <td colspan="3"><input type="text" name="nome" size="50"></td>
            </tr>
            <tr>
                <td>Endereço:</td>
                <td><input type="text" name="endereco"></td>
                <td>Número:</td>
                <td><input type="text" name="numero" size="10"></td>
            </tr>
            <tr>
                <td>Complemento:</td>
                <td><input type="text" name="complemento"></td>
                <td>Celular:</td>
                <td><input type="text" name="celular" size="15"></td>
            </tr>
            <tr>
                <td>Bairro:</td>
                <td><input type="text" name="bairro"></td>
                <td>CEP:</td>
                <td><input type="text" name="cep" size="15"></td>
            </tr>
            <tr>
                <td>Cidade:</td>
                <td><input type="text" name="cidade"></td>
                <td>UF:</td>
                <td>
                    <select name="uf">
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AP">AP</option>
                        <option value="AM">AM</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MT">MT</option>
                        <option value="MS">MS</option>
                        <option value="MG">MG</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PR">PR</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RS">RS</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="SC">SC</option>
                        <option value="SP">SP</option>
                        <option value="SE">SE</option>
                        <option value="TO">TO</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="email" name="email"></td>
                <td>Cargo:</td>
                <td>
                    <select name="cargo">
                        <option value="Programador">Programador</option>
                        <option value="Diretor">Diretor</option>
                        <option value="Coordenador">Coordenador</option>
                        <option value="Analista">Analista</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Usuário:</td>
                <td><input type="text" name="usuario"></td>
                <td>Senha:</td>
                <td><input type="password" name="senha"></td>
            </tr>
            <tr>
                <td>Departamento:</td>
                <td>
                    <select name="departamento">
                        <option>Selecione Departamento</option>
                        <option>TI</option>
                        <option>Financeiro</option>
                        <option>RH</option>
                    </select>
                </td>
                <td colspan="2" align="right">
                    <input type="submit" value="Enviar">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
