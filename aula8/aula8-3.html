<html><head><title>Meu Site</title></head><body>
<script type="text/javascript">
var estado;
estado=prompt('Informe o Estado','SP');
switch(estado) {
 case 'MG': alert ("Minas Gerais");break;
 case 'SP': alert ("São Paulo"); break;
 case 'RJ': alert ("Rio de Janeiro");break;
 case 'SC': alert ('Santa Catarina');break;
 case 'PR': alert ('Paraná');break;
 default:alert ("Estado Incorreto");
}
</script>
</body></html>
